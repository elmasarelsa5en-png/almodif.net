<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إصلاح جميع الصور</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
            transform: none;
        }
        #results {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            min-height: 100px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
        }
        .log-item {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .info { color: #3b82f6; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            opacity: 0.9;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ إصلاح جميع الصور</h1>
        <p class="subtitle">سيتم استبدال جميع الصور بصور احترافية مناسبة لكل فئة</p>
        
        <button id="startBtn" onclick="fixAllImages()">
            🚀 ابدأ التحديث الآن
        </button>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">☕ أصناف القهوة</div>
                <div class="stat-number" id="coffeeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🧺 أصناف المغسلة</div>
                <div class="stat-number" id="laundryCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📊 الإجمالي</div>
                <div class="stat-number" id="totalCount">0</div>
            </div>
        </div>
        
        <div id="results"></div>
    </div>

        const firebaseConfig = {
            apiKey: "AIzaSyDpgPh8L_5eSHY6KdO__u3lZBM9Vz1AhAQ",

            projectId: "almodif",
            storageBucket: "almodif.firebasestorage.app",
            messagingSenderId: "1047498170114",
            appId: "1:1047498170114:web:a23bda21baf4d7c6bea01b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // صور احترافية للمغسلة

            'تنورة': 'https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=400&h=400&fit=crop',

            'مطر': 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&h=400&fit=crop',
            'بالطو': 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400&h=400&fit=crop',

        };

        // صور احترافية للقهوة
        const coffeeImages = {
            'إسبريسو': 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400&h=400&fit=crop',

            'لاتيه': 'https://images.unsplash.com/photo-1561882468-9110e03e0f78?w=400&h=400&fit=crop',

            'فلات': 'https://images.unsplash.com/photo-1599639957043-f5e8c73c2f85?w=400&h=400&fit=crop',

            'أفوكادو': 'https://images.unsplash.com/photo-1623428187969-5da2dcea5ebf?w=400&h=400&fit=crop',

            'ليمون': 'https://images.unsplash.com/photo-1523677011781-c91d1bbe2f9b?w=400&h=400&fit=crop',
            'كرواسون': 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&h=400&fit=crop',
            'كيك': 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&h=400&fit=crop',
            'براوني': 'https://images.unsplash.com/photo-1607920591413-4ec007e70023?w=400&h=400&fit=crop',
            'دونات': 'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=400&h=400&fit=crop',
            'مافن': 'https://images.unsplash.com/photo-1607958996333-41aef7caefaa?w=400&h=400&fit=crop',
            'كوكيز': 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400&h=400&fit=crop',
            'تشيز': 'https://images.unsplash.com/photo-1524351199678-941a58a3df50?w=400&h=400&fit=crop',
            'default': 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&h=400&fit=crop'
        };

        function findBestImage(itemName, imagesMap) {
            const nameLower = itemName.toLowerCase();
            
            // البحث عن مطابقة مباشرة
            for (const [key, image] of Object.entries(imagesMap)) {
                if (key === 'default') continue;
                if (nameLower.includes(key.toLowerCase()) || key.toLowerCase().includes(nameLower)) {
                    return image;
                }
            }
            
            return imagesMap.default;
        }

        function addLog(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type}`;
            logItem.textContent = message;
            resultsDiv.appendChild(logItem);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        window.fixAllImages = async function() {
            const startBtn = document.getElementById('startBtn');
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');
            
            startBtn.disabled = true;
            startBtn.textContent = '⏳ جاري التحديث...';
            resultsDiv.innerHTML = '';
            statsDiv.style.display = 'grid';
            
            let coffeeCount = 0;
            let laundryCount = 0;
            
            try {
                addLog('🔄 بدء تحميل الأصناف من Firebase...', 'info');
                
                const menuItemsRef = collection(db, 'menu-items');
                const snapshot = await getDocs(menuItemsRef);
                
                addLog(`✅ تم تحميل ${snapshot.size} صنف`, 'success');
                
                for (const docSnapshot of snapshot.docs) {
                    const item = docSnapshot.data();
                    const itemRef = doc(db, 'menu-items', docSnapshot.id);
                    
                    let newImage = null;
                    let emoji = '';
                    
                    if (item.category === 'coffee-shop') {
                        newImage = findBestImage(item.nameAr, coffeeImages);
                        emoji = '☕';
                        coffeeCount++;
                    } else if (item.category === 'laundry') {
                        newImage = findBestImage(item.nameAr, laundryImages);
                        emoji = '🧺';
                        laundryCount++;
                    }
                    
                    if (newImage) {
                        await updateDoc(itemRef, {
                            image: newImage,
                            updatedAt: new Date().toISOString()
                        });
                        addLog(`${emoji} تم تحديث: ${item.nameAr}`, 'success');
                    }
                    
                    document.getElementById('coffeeCount').textContent = coffeeCount;
                    document.getElementById('laundryCount').textContent = laundryCount;
                    document.getElementById('totalCount').textContent = coffeeCount + laundryCount;
                }
                
                addLog('', 'info');
                addLog('🎉 تم تحديث جميع الصور بنجاح!', 'success');
                addLog(`📊 الإحصائيات النهائية:`, 'info');
                addLog(`   ☕ أصناف القهوة: ${coffeeCount}`, 'info');
                addLog(`   🧺 أصناف المغسلة: ${laundryCount}`, 'info');
                addLog(`   📝 الإجمالي: ${coffeeCount + laundryCount}`, 'info');
                
                startBtn.textContent = '✅ تم التحديث بنجاح';
                startBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                
            } catch (error) {
                console.error('Error:', error);
                addLog(`❌ خطأ: ${error.message}`, 'error');
                startBtn.disabled = false;
                startBtn.textContent = '🔄 إعادة المحاولة';
            }
        };
    </script>
</body>
</html>
